<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover</title>
<link rel="stylesheet" href="../code/tokens.css">
<link rel="stylesheet" href="../code/ui-kit.css">
</head>
<body>
<div class="ui-stage" style="align-items:flex-start">
<div class="ui-popover"><h4>Столбцы таблицы</h4><div class="sub">Оставьте нужные для работы</div><div class="body"><span class="ui-check is-checked"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Наименование</span><span class="ui-check is-checked"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Тип изделия</span><span class="ui-check"><i></i>Базовое кол-во натиров</span><span class="ui-check is-checked"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Статус</span><span class="ui-check is-checked"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Создано</span></div><div class="foot"><button class="ui-btn ui-btn-outline">Выделить все</button><button class="ui-btn ui-btn-primary">Применить</button></div></div>
<div class="ui-popover"><h4>Фильтры</h4><div class="sub">Задайте условия отбора записей</div><div class="body">
<div class="ui-field"><label class="ui-label">Наименование</label><div class="ui-input"><span class="ui-input-text ui-ph">Введите наименование</span></div></div>
<div class="ui-field"><label class="ui-label">Тип изделия</label><div class="ui-input"><span class="ui-input-text ui-ph">Любое значение</span><span class="ui-trail"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></span></div></div>
<div class="ui-field"><label class="ui-label">Статус</label><div class="ui-input"><span class="ui-input-text ui-ph">Любое значение</span><span class="ui-trail"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></span></div></div>
</div><div class="foot"><button class="ui-btn ui-btn-outline">Сбросить все</button><button class="ui-btn ui-btn-primary">Применить</button></div></div>
</div>
</body>
</html>
