<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast</title>
<link rel="stylesheet" href="../code/tokens.css">
<link rel="stylesheet" href="../code/ui-kit.css">
</head>
<body>
<div class="ui-stage col" style="align-items:flex-start">
<div class="ui-toast is-success"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="grow"><b>Готово</b><span>Удалено изделий: 1.</span></span><span class="x"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
<div class="ui-toast is-error"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16v.01"/></svg></span><span class="grow"><b>Ошибка</b><span>Запись ссылается на другую запись</span></span><span class="x"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
<div class="ui-toast is-warning"><span class="ic"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16v.01"/></svg></span><span class="grow"><b>Внимание</b><span>Изменения не сохранены.</span></span><span class="x"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
</div>
</body>
</html>
