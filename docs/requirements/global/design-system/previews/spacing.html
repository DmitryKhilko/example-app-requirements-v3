<body>
<div class="ds-h">Отступы</div><div class="ds-bar"><code>space-1</code><i style="width:4px"></i><span>4px</span></div><div class="ds-bar"><code>space-2</code><i style="width:8px"></i><span>8px</span></div><div class="ds-bar"><code>space-3</code><i style="width:12px"></i><span>12px</span></div><div class="ds-bar"><code>space-4</code><i style="width:16px"></i><span>16px</span></div><div class="ds-bar"><code>space-5</code><i style="width:20px"></i><span>20px</span></div><div class="ds-bar"><code>space-6</code><i style="width:24px"></i><span>24px</span></div><div class="ds-bar"><code>space-8</code><i style="width:32px"></i><span>32px</span></div><div class="ds-bar"><code>space-10</code><i style="width:40px"></i><span>40px</span></div><div class="ds-h">Скругления</div><div class="ui-stage"><div class="ds-box" style="border-radius:var(--radius-sm)">radius-sm</div><div class="ds-box" style="border-radius:var(--radius-md)">radius-md</div><div class="ds-box" style="border-radius:var(--radius-full);width:72px;justify-content:center;align-items:center">full</div></div><div class="ds-h">Тени</div><div class="ui-stage"><div class="ds-box" style="border:0;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)">shadow-sm</div><div class="ds-box" style="border:0;border-radius:var(--radius-md);box-shadow:var(--shadow-md)">shadow-md</div><div class="ds-box" style="border:0;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)">shadow-lg</div></div><div class="ds-h">Высоты контролов</div><div class="ds-bar"><code>control-sm</code><i style="width:24px;height:28px"></i><span>28px</span></div><div class="ds-bar"><code>control-md</code><i style="width:24px;height:36px"></i><span>36px</span></div><div class="ds-bar"><code>control-lg</code><i style="width:24px;height:40px"></i><span>40px</span></div>
</body>
</html>
