# ==========================================================================
# rms.toml — настройки продукта для движка rms-engine
#
# Скрипты движка (версии и журналы, статусы, меню, дашборд) общие для всех продуктов. Здесь — только то, что у этого
# продукта своё. Все разделы необязательны: без раздела действует значение движка по умолчанию (py/config.py движка).
# ==========================================================================

# --- Неизменная часть меню ---
# Записывается так же, как блок nav в zensical.toml: { "Название" = "путь.md" } — страница,
# { "Название" = [ … ] } — группа, "путь.md" без названия — страница, которая открывается щелчком на группе.
# Пути — относительно docs/. Места групп, которые скрипт собирает сам:
#   "@registry"  — «Реестр требований» (фичи из папки [registry] dir);
#   "@global_sf" — «Глобальные функциональности» (папки [global_sf] dir с приставкой [global_sf] prefix).
[nav]
items = [
    { "О продукте" = "index.md" },
    { "Проект" = "project/index.md" },
    { "Требования" = [
        { "Глоссарий" = "requirements/business-context/glossary.md" },
        { "Бизнес-требования" = "requirements/business-context/business-requirements.md" },
        { "Глобальные требования" = [
            "requirements/global/index.md",
            { "Дизайн-система" = "requirements/global/design-system/index.md" },
            { "Требования к API" = "requirements/global/ar.md" },
            { "Нефункциональные требования" = "requirements/global/nfr.md" },
            { "Системные требования" = "requirements/global/sr.md" },
            "@global_sf",
        ] },
        "@registry",
    ] },
    { "Архив" = "requirements-archive/index.md" },
    # Раздел «Методология» пока скрыт; чтобы показать, раскомментируйте:
    # { "Методология" = [
    #     { "Глоссарий" = "methodology/glossary.md" },
    #     { "Стандарт создания требований к ПО" = "methodology/standard-requirements.md" },
    #     { "Взаимосвязь требований к ПО" = "methodology/relationships-requirements.md" },
    # ] },
]

# --- Реестр требований и дашборд ---
# Каждая подпапка dir с index.md — фича (F); дашборд — на странице page (пути относительно docs/).
[registry]
title = "Реестр требований"
dir = "requirements/features"

[dashboard]
page = "requirements/features/index.md"

# --- Глобальные функциональности ---
# Подпапки dir с приставкой prefix и файлом index.md. Названия в меню — в [global_sf.titles]; порядок записей — порядок
# в меню; папки не из списка идут после, по алфавиту, под своим именем (скрипт выведет предупреждение).
[global_sf]
title = "Глобальные функциональности"
dir = "requirements/global"
prefix = "sf-g-"

[global_sf.titles]
sf-g-dict = "Экран справочника"
sf-g-catalog = "Каталог справочников"
sf-g-table = "Таблица"
sf-g-pag = "Пагинация"
sf-g-sort = "Сортировка"
sf-g-search = "Поиск"
sf-g-filter = "Фильтрация"
sf-g-columns = "Столбцы"
sf-g-select = "Выделение"
sf-g-confirm = "Подтверждение"
sf-g-form = "Форма записи"
sf-g-lock = "Блокировка"
sf-g-session = "Сессия"
sf-g-toast = "Уведомления"

# --- Названия папок и файлов фич в меню ---
# Стандартные названия задаёт движок: папки sf-list «Список», sf-read «Карточка», sf-create «Создание», sf-update
# «Изменение», sf-activation «Активация», sf-delete «Удаление», f «Общие»; файлы uc.md «UC», dr.md «DR», fr.md «FR»,
# ar.md «AR», nfr.md «NFR», ui.md «UI». Здесь их можно дополнить: та же папка (файл) — другое название, новая — в конец
# списка. Пример:
# [titles.folders]
# sf-export = "Выгрузка"
# [titles.files]
# context.md = "Контекст"
