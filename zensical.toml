# ==========================================================================
# zensical.toml — конфигурация сайта требований (Zensical, подход Documentation as Code)
#
# Порядок разделов:
#   1. [project]            — сведения о сайте и репозитории (у продукта свои)
#   2. Меню (nav)           — формируется скриптом движка, вручную не редактируется
#   3. Общие настройки      — тема, возможности, шрифты, цветовые схемы, расширения Markdown: блок BEGIN/END ENGINE
#                             SETTINGS переписывается при каждой сборке из zensical.base.toml движка rms-engine;
#                             вручную не редактируется (изменения пропадут) — меняйте их в движке, для всех продуктов
#   4. [project.extra]      — значения для шаблонов и скриптов (трекер; у продукта свои)
#
# Ключи раздела [project] пишутся только в разделе 1 (до блока общих настроек), каждая своя таблица продукта — со своим
# заголовком после блока. Документы аналитиков и изображения — в docs/.
# Подробнее — в README.md.
# ==========================================================================

# --- 1. САЙТ И РЕПОЗИТОРИЙ ---
[project]
site_name = "Подсистема автоматизации деятельности ГИПН"
site_description = "Пример организации требований с использованием подхода Documentation as Code"
site_url = "https://dmitrykhilko.github.io/example-app-requirements-v3/"
site_author = "Дмитрий Хилько"
# Ссылка на репозиторий в шапке и кнопка «Править страницу» (content.action.edit): адрес правки = repo_url + edit_uri + путь к файлу
repo_url = "https://github.com/DmitryKhilko/example-app-requirements-v3"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"

